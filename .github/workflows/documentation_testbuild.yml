name: Test Documentation Build

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

# Default to bash
defaults:
  run:
    shell: bash

jobs:

  check-release-tag:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - id: check
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" &&
                "$GITHUB_REF_NAME" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Tag identified as release for purpose of this GitHub Action."
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Tag identified as release for purpose of this GitHub Action."
          fi

  dump-context:
    runs-on: ubuntu-latest
    steps:
      - name: Dump context "GitHub"
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT"

  test-build-documentation:
    runs-on: ubuntu-latest
    needs: check-release-tag
    if: needs.check-release-tag.outputs.is_release != 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch pre-commit
          hatch env create docs
      - name: Build documentation
        run: hatch run docs:build-check
